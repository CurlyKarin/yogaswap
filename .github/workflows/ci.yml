name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # Pin: Playwright 1.58.x supports ubuntu24.04, not ubuntu26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install shared & build
        run: |
          cd shared && npm ci && npm run build && cd ..

      - name: App – install, lint, build, test
        run: |
          cd app && npm ci && npm run lint && npm run build && npm run test && cd ..

      - name: App – E2E (Playwright)
        run: |
          cd app && npx playwright install --with-deps chromium && npm run test:e2e

      - name: Backend – install, lint, build, test
        run: |
          cd backend && npm ci && npm run lint && npm run build && npm test && cd ..
