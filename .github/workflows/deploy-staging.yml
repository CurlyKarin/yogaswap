# Staging-Deploy nach Merge auf main (#15).
#
# Voraussetzungen (noch nicht alles erledigt):
# 1. OIDC-Rolle in AWS  ✅  (yogaswap-github-actions-deploy, Secret DEPLOY_ROLE_ARN)
# 2. Remote-State (S3) für OpenTofu — sonst kennt CI die bestehenden Ressourcen nicht
# 3. GitHub Environment Secrets "staging":
#    - ENV_STAGING_JSON   → Inhalt von projects/yogaswap/env.staging.json
#    - APP_ENV_STAGING    → Inhalt von app/.env.staging
#
# Warum Frontend-Build im Job?
# deploy.sh lädt app/build nach S3. Ohne frischen Build für --mode staging
# könnte ein falsches Bundle live gehen (wie schon einmal bei prod passiert).

name: Deploy Staging

on:
  # Nach Merge auf main automatisch
  push:
    branches: [main]
  # Manuell unter Actions → Deploy Staging → Run workflow
  workflow_dispatch:

# Keine dauerhaften AWS-Keys; OIDC liefert kurzlebige Credentials.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.0"

      # OIDC: GitHub bekommt temporäre AWS-Credentials über die IAM-Rolle.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      # Sensible Env-Dateien aus Environment-Secrets.
      # Wichtig: Secret zuerst in env: legen — direktes ${{ secrets.* }} in run:
      # zerbricht JSON (u. a. wegen `}`), und printf kann `%` falsch interpretieren.
      - name: Write OpenTofu env.staging.json
        env:
          ENV_STAGING_JSON: ${{ secrets.ENV_STAGING_JSON }}
        run: |
          python3 -c 'import os, pathlib; pathlib.Path("projects/yogaswap/env.staging.json").write_text(os.environ["ENV_STAGING_JSON"])'
          python3 -c 'import json; json.load(open("projects/yogaswap/env.staging.json")); print("env.staging.json: OK")'

      - name: Write app/.env.staging
        env:
          APP_ENV_STAGING: ${{ secrets.APP_ENV_STAGING }}
        run: |
          python3 -c 'import os, pathlib; pathlib.Path("app/.env.staging").write_text(os.environ["APP_ENV_STAGING"])'
          test -s app/.env.staging && echo "app/.env.staging: OK"

      # Wichtig: immer neu bauen — Workspace staging → Vite --mode staging.
      # Kein --skip-build: sonst riskiert man ein Bundle einer anderen Env.
      - name: Deploy staging
        run: ./scripts/deploy.sh staging --auto-approve
